name: RentFlow diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze and save log
        shell: bash
        run: |
          set +e
          flutter analyze lib --no-fatal-infos 2>&1 | tee analyze.log
          echo ${PIPESTATUS[0]} > analyze.exit
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rentflow-analyzer-diagnostics
          path: |
            analyze.log
            analyze.exit
          retention-days: 7
