name: RentFlow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --project-name rentflow --org com.shanpalia --platforms android .

      - name: Apply RentFlow app icon and label
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_rentflow.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00A889" android:pathData="M18,4 L90,4 Q104,4 104,18 L104,90 Q104,104 90,104 L18,104 Q4,104 4,90 L4,18 Q4,4 18,4 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M25,42 L65,42 L57,34 L63,28 L82,47 L63,66 L57,60 L65,52 L25,52 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M83,66 L43,66 L51,58 L45,52 L26,71 L45,90 L51,84 L43,76 L83,76 Z"/>
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_rentflow"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/ic_rentflow"')
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
