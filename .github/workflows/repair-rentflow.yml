name: Repair RentFlow source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-rentflow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Fix the actual syntax error without replacing the app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/rentflow_emerald.dart')
          s = p.read_text(encoding='utf-8')
          old = "      ...items.map((x) => Card(elevation: 0, child: ListTile(title: Text('${x['name']}', style: const TextStyle(fontWeight: FontWeight.w800)), subtitle: Text('Stock ${x['quantity'] ?? 0} • Issued ${issuedByItem['${x['id']}'] ?? 0} • Returned ${returnedByItem['${x['id']}'] ?? 0} • Rent ${money(x['rentPrice'])}/100'), trailing: Text('${x['quantity'] ?? 0}', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.w900, color: emerald)))),"
          new = "      ...items.map((x) => Card(elevation: 0, child: ListTile(title: Text('${x['name']}', style: const TextStyle(fontWeight: FontWeight.w800)), subtitle: Text('Stock ${x['quantity'] ?? 0} • Issued ${issuedByItem['${x['id']}'] ?? 0} • Returned ${returnedByItem['${x['id']}'] ?? 0} • Rent ${money(x['rentPrice'])}/100'), trailing: Text('${x['quantity'] ?? 0}', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.w900, color: emerald))))),"
          if old not in s:
              raise SystemExit('Expected InventoryPage line not found; source was not modified')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format Dart source
        run: dart format lib/rentflow_emerald.dart

      - name: Analyze Dart source
        run: flutter analyze lib/rentflow_emerald.dart

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rentflow_emerald.dart .github/workflows/repair-rentflow.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "fix: repair RentFlow Dart syntax"
          git push
