name: Repair RentFlow source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-rentflow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Apply the requested Returns and rental-rate fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/rentflow_emerald.dart')
          s = p.read_text(encoding='utf-8')

          # Return calculation: Rent Price is stored as the price for 100 units.
          # Example: ₹15 / 100 = ₹0.15 per unit, so 500 units for 1 day = ₹75.
          old = "    final amount = r * selectedQty * days / 100;"
          new = "    final unitRate = r / 100;\n    final amount = unitRate * selectedQty * days;"
          if old in s:
              s = s.replace(old, new, 1)

          old = "                  Text('Issued Qty $max • Rent ${money(r)}/100'),"
          new = "                  Text(\n                    'Issued Qty $max • Rent ${money(r)} / 100 = ${money(unitRate)} / unit',\n                  ),"
          if old in s:
              s = s.replace(old, new, 1)

          old = "                    'Rent Days $days • Amount ${money(amount)}',"
          new = "                    'Rent Days $days • ${money(r)} / 100 = ${money(unitRate)} / unit • Amount ${money(amount)}',"
          if old in s:
              s = s.replace(old, new, 1)

          # Return screen: keep Party and Issued Invoice selection, but do not
          # show Return No., Issued Date or Return Date fields/text.
          old = '''          if (issue != null) ...[\n            const SizedBox(height: 12),\n            Text(\n              'Issued date: ${issue!['issueDate']} • Return date: ${today()}',\n              style: const TextStyle(fontWeight: FontWeight.w800),\n            ),\n            const SizedBox(height: 8),'''
          new = '''          if (issue != null) ...[\n            const SizedBox(height: 12),'''
          if old in s:
              s = s.replace(old, new, 1)

          # Add the same transparent rate calculation to Add / Edit Item.
          old = '''        const Padding(\n          padding: EdgeInsets.only(bottom: 12),\n          child: Align(\n            alignment: Alignment.centerLeft,\n            child: Text(\n              'Example: ₹15 per 100 • rent is calculated on returned quantity and numeric rent days.',\n            ),\n          ),\n        ),'''
          new = '''        ValueListenableBuilder<TextEditingValue>(\n          valueListenable: rent,\n          builder: (_, value, __) {\n            final rate100 = numDouble(value.text);\n            final unitRate = rate100 / 100;\n            return Padding(\n              padding: const EdgeInsets.only(bottom: 12),\n              child: Align(\n                alignment: Alignment.centerLeft,\n                child: Text(\n                  '${money(rate100)} / 100 = ${money(unitRate)} / unit',\n                  style: const TextStyle(\n                    color: emeraldDark,\n                    fontWeight: FontWeight.w700,\n                  ),\n                ),\n              ),\n            );\n          },\n        ),'''
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Format Dart source
        run: dart format lib/rentflow_emerald.dart

      - name: Analyze Dart source
        run: dart analyze lib/rentflow_emerald.dart

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rentflow_emerald.dart
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "fix: finalize RentFlow returns calculation UI"
          git push
