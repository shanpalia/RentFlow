name: Repair RentFlow source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-rentflow.yml'
      - 'tool/repair_returns.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Restore known-good RentFlow source
        shell: bash
        run: |
          set -euo pipefail
          git checkout efa9e558965a98f8ca18bcd3465b8dd4ca490b0e -- lib/rentflow_emerald.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/rentflow_emerald.dart')
          s = p.read_text(encoding='utf-8')
          old = "      );\n\nclass HomePage extends StatefulWidget {"
          new = "      );\n}\n\nclass HomePage extends StatefulWidget {"
          if old not in s:
              raise SystemExit('Expected AppDrawer/HomePage boundary not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply Returns UI repair
        run: python3 tool/repair_returns.py

      - name: Format and analyze
        run: |
          set -euo pipefail
          dart format lib
          flutter analyze lib/rentflow_emerald.dart

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rentflow_emerald.dart
          git rm .github/workflows/fix-return-ui.yml 2>/dev/null || true
          git commit -m "fix: restore RentFlow returns UI"
          git push
