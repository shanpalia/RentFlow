name: RentFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android platform
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Android platform is missing; generating it from the Flutter project."
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/gradlew

      - name: Apply RentFlow branding and professional UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Replace the generated Flutter launcher icon with a real RentFlow icon.
          res = Path('android/app/src/main/res')
          drawable = res / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'rentflow_launcher.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00A889" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M24,42h44l-8,-8 7,-7 20,20 -20,20 -7,-7 8,-8H24z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M84,66H40l8,8 -7,7 -20,-20 20,-20 7,7 -8,8h44z" />
          </vector>''')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              text = manifest.read_text()
              text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/rentflow_launcher"', text, count=1)
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/rentflow_launcher"', text, count=1)
              if 'android:label=' in text:
                  text = re.sub(r'android:label="[^"]+"', 'android:label="RentFlow"', text, count=1)
              manifest.write_text(text)

          # Replace the old settings page at build time so the APK always contains
          # the requested branding and a clearly visible update button.
          main = Path('lib/main.dart')
          text = main.read_text()
          replacement = r'''class SettingsPage extends StatelessWidget {
  final Future<void> Function({bool silent}) onCheck;
  const SettingsPage({required this.onCheck, super.key});

  Future<void> openWebsite() => launchUrl(
        Uri.parse(websiteUrl),
        mode: LaunchMode.externalApplication,
      );

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      child: CustomScrollView(
        slivers: [
          SliverToBoxAdapter(
            child: Padding(
              padding: const EdgeInsets.fromLTRB(20, 22, 20, 10),
              child: Row(
                children: [
                  const LogoMark(size: 62),
                  const SizedBox(width: 16),
                  const Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('Settings', style: TextStyle(fontSize: 30, fontWeight: FontWeight.w900, color: dark)),
                        SizedBox(height: 4),
                        Text('App, updates and branding', style: TextStyle(fontSize: 16, color: muted)),
                      ],
                    ),
                  ),
                ],
              ),
            ),
          ),
          SliverToBoxAdapter(
            child: Padding(
              padding: const EdgeInsets.fromLTRB(20, 12, 20, 14),
              child: Container(
                padding: const EdgeInsets.all(22),
                decoration: BoxDecoration(
                  gradient: const LinearGradient(begin: Alignment.topLeft, end: Alignment.bottomRight, colors: [Color(0xFFE9FAF5), Color(0xFFD8F3EB)]),
                  borderRadius: BorderRadius.circular(28),
                  border: Border.all(color: const Color(0x3300A889)),
                  boxShadow: const [BoxShadow(color: Color(0x1800A889), blurRadius: 22, offset: Offset(0, 10))],
                ),
                child: Row(
                  children: [
                    const LogoMark(size: 92),
                    const SizedBox(width: 18),
                    const Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text('RentFlow', style: TextStyle(fontSize: 30, fontWeight: FontWeight.w900, color: dark)),
                          SizedBox(height: 6),
                          Text('By PaliaAPK HUB', style: TextStyle(fontSize: 19, fontWeight: FontWeight.w900, color: primary)),
                          SizedBox(height: 5),
                          Text('Developer by shanpalia', style: TextStyle(fontSize: 15, color: muted, fontWeight: FontWeight.w600)),
                        ],
                      ),
                    ),
                  ],
                ),
              ),
            ),
          ),
          SliverToBoxAdapter(
            child: Padding(
              padding: const EdgeInsets.fromLTRB(20, 4, 20, 12),
              child: Container(
                padding: const EdgeInsets.all(18),
                decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(22), boxShadow: const [BoxShadow(color: Color(0x12000000), blurRadius: 16, offset: Offset(0, 6))]),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Row(children: [
                      Icon(Icons.system_update_rounded, color: primary, size: 26),
                      SizedBox(width: 10),
                      Text('App Updates', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w900, color: dark)),
                    ]),
                    const SizedBox(height: 8),
                    const Text('Check whether a newer RentFlow APK is available.', style: TextStyle(color: muted)),
                    const SizedBox(height: 14),
                    SizedBox(
                      width: double.infinity,
                      child: FilledButton.icon(
                        onPressed: () => onCheck(silent: false),
                        icon: const Icon(Icons.download_rounded),
                        label: const Text('Check for Updates', style: TextStyle(fontSize: 16, fontWeight: FontWeight.w900)),
                        style: FilledButton.styleFrom(backgroundColor: primary, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(54), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16))),
                      ),
                    ),
                  ],
                ),
              ),
            ),
          ),
          SliverToBoxAdapter(
            child: Padding(
              padding: const EdgeInsets.fromLTRB(20, 0, 20, 12),
              child: Card(
                elevation: 0,
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(22)),
                child: ListTile(
                  contentPadding: const EdgeInsets.symmetric(horizontal: 18, vertical: 8),
                  leading: const CircleAvatar(backgroundColor: mint, child: Icon(Icons.language_rounded, color: primary)),
                  title: const Text('PaliaAPK HUB Website', style: TextStyle(fontWeight: FontWeight.w900)),
                  subtitle: const Text('Open official website'),
                  trailing: const Icon(Icons.open_in_new_rounded, color: primary),
                  onTap: openWebsite,
                ),
              ),
            ),
          ),
          SliverToBoxAdapter(
            child: Padding(
              padding: const EdgeInsets.only(top: 8, bottom: 30),
              child: Column(
                children: [
                  Text('RentFlow $currentVersion', style: const TextStyle(color: muted, fontWeight: FontWeight.w700)),
                  const SizedBox(height: 5),
                  const Text('Rental management made simple', style: TextStyle(color: muted)),
                  const SizedBox(height: 4),
                  const Text('By PaliaAPK HUB • Developer by shanpalia', style: TextStyle(color: muted, fontSize: 12)),
                ],
              ),
            ),
          ),
        ],
      ),
    );
  }
}
'''
          pattern = r'class SettingsPage extends StatelessWidget \{.*?(?=\nclass Metric extends StatelessWidget \{)'
          new_text, count = re.subn(pattern, replacement.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('SettingsPage replacement target not found')
          main.write_text(new_text)
          PY

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q "class RentFlowApp" lib/main.dart
          grep -q "label: 'Settings'" lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze RentFlow
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
