name: RentFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create Android local.properties
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android wrapper --gradle-version 8.14.3
          chmod +x android/gradlew

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/app.dart
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          grep -E 'distributionUrl=.*gradle-8\.14\.[0-9]+.*-bin\.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Validate and analyze Dart source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/app.dart')
          s = p.read_text(encoding='utf-8')

          # Normalize generated nullable List syntax.
          s = s.replace('as List???[]', 'as List? ?? []')
          s = s.replace('as List???[', 'as List? ?? [')

          # Replace the generated StatCard as a complete, balanced widget.
          # This avoids fragile one-character parenthesis fixes.
          stat = '''class StatCard extends StatelessWidget {
            final String label;
            final String value;
            final IconData icon;
            const StatCard(this.label, this.value, this.icon, {super.key});

            @override
            Widget build(BuildContext context) {
              return Expanded(
                child: Container(
                  padding: const EdgeInsets.all(15),
                  decoration: BoxDecoration(
                    color: Colors.white,
                    borderRadius: BorderRadius.circular(20),
                    border: Border.all(color: line),
                  ),
                  child: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(11),
                        decoration: BoxDecoration(
                          color: const Color(0xFFE7F7F2),
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: Icon(icon, color: primary, size: 27),
                      ),
                      const SizedBox(width: 10),
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            value,
                            style: const TextStyle(
                              color: dark,
                              fontSize: 22,
                              fontWeight: FontWeight.w900,
                            ),
                          ),
                          Text(
                            label,
                            style: const TextStyle(color: Colors.black54),
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          '''
          s, n = re.subn(r'class StatCard extends StatelessWidget \{.*?\n\}\nclass ActionBox', stat + 'class ActionBox', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not locate StatCard block for replacement')

          # Keep the PDF parser correction if that generated form is present.
          old_pdf = "pw.Text('RentFlow  •  By PaliaAPK HUB  •  Developer by ShanPalia')]));\n  final bytes"
          if old_pdf in s:
              s = s.replace(old_pdf, old_pdf.replace(']));\n  final bytes', '])));\n  final bytes'), 1)

          p.write_text(s, encoding='utf-8')
          PY
          flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign release APK for device installation
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/rentflow-test-release.jks"
          ALIAS="rentflow"
          PASSWORD="rentflow-release-2026"
          test -s "$APK"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASSWORD" -keypass "$PASSWORD" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RentFlow, OU=PaliaAPK HUB, O=ShanPalia, L=Lucknow, ST=Uttar Pradesh, C=IN" -noprompt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$PASSWORD" --key-pass "pass:$PASSWORD" --ks-key-alias "$ALIAS" --out "$APK" "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
