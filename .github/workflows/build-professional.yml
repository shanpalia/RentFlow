name: RentFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create Android local.properties
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android wrapper --gradle-version 8.14.3
          chmod +x android/gradlew

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f android/gradlew
          test -f assets/rentflow_logo.svg
          test -f assets/rentflow_splash.svg
          test -f lib/rentflow_emerald.dart
          test -f lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Repair Emerald source syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/rentflow_emerald.dart')
          s = p.read_text(encoding='utf-8')

          # Remove the extra closing brace in the Settings update callback.
          s = s.replace(
              "mode:LaunchMode.externalApplication);}})),const Card",
              "mode:LaunchMode.externalApplication);}}),const Card",
          )

          # Use two independent collection-if branches instead of an if/else
          # collection expression. This avoids the parser issue in the generated
          # one-line Home widget while preserving the same UI flow.
          start = s.find('class Home extends StatefulWidget')
          end = s.find('class ShopForm extends StatefulWidget')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Home class boundaries not found')

          home = r'''class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            final s = Store();
            @override
            void initState() {
              super.initState();
              s.load();
            }

            void go(BuildContext c, Widget page) {
              openPage(c, page);
            }

            @override
            Widget build(BuildContext c) {
              return AnimatedBuilder(
                animation: s,
                builder: (_, __) {
                  if (!s.ready) {
                    return const Scaffold(body: Center(child: CircularProgressIndicator()));
                  }
                  return Scaffold(
                    appBar: const Header(),
                    body: ListView(
                      padding: const EdgeInsets.all(16),
                      children: [
                        const Text('Main Menu', style: TextStyle(fontSize: 29, fontWeight: FontWeight.w900, color: ink)),
                        const SizedBox(height: 4),
                        const Text('Emerald ERP workspace', style: TextStyle(color: Colors.black54)),
                        const SizedBox(height: 18),
                        if (!s.has)
                          Card(
                            elevation: 0,
                            child: Padding(
                              padding: const EdgeInsets.all(22),
                              child: Column(
                                children: [
                                  const Icon(Icons.store_rounded, size: 46, color: green),
                                  const SizedBox(height: 8),
                                  const Text('Register your shop', style: TextStyle(fontSize: 21, fontWeight: FontWeight.w900)),
                                  const SizedBox(height: 6),
                                  const Text('You can skip now. Entry screens will ask for registration first.', textAlign: TextAlign.center),
                                  const SizedBox(height: 14),
                                  Button('Register Shop', () => go(c, ShopForm(s)), icon: Icons.add_business_rounded),
                                ],
                              ),
                            ),
                          ),
                        if (s.has) ...[
                          Row(
                            children: [
                              Expanded(child: Text('${s.shop['name'] ?? ''}', style: const TextStyle(fontWeight: FontWeight.w900, color: dark))),
                              TextButton.icon(onPressed: () => go(c, Shops(s)), icon: const Icon(Icons.store_outlined, color: green), label: const Text('Shops')),
                            ],
                          ),
                          const Section('MASTERS'),
                          Menu('Inventory', 'Item master • multiple entries', Icons.inventory_2_outlined, () => go(c, Items(s))),
                          Menu('Customers', 'Party master • add / edit / delete', Icons.people_alt_outlined, () => go(c, Customers(s))),
                          Menu('Shop / Company', 'Edit, delete, add another shop', Icons.store_outlined, () => go(c, Shops(s))),
                          const SizedBox(height: 12),
                          const Section('TRANSACTIONS'),
                          Menu('Issued', 'Invoice + customer + multiple inventory rows', Icons.outbox_rounded, () => go(c, Issued(s))),
                          Menu('Return', 'Customer dropdown + issued items + manual amount', Icons.assignment_return_rounded, () => go(c, Returns(s))),
                          const SizedBox(height: 12),
                          const Section('REGISTERS & REPORTS'),
                          Menu('Inventory Register', 'Tally / Busy style item register', Icons.table_rows_rounded, () => go(c, InventoryRegister(s))),
                          Menu('Issue / Return Register', 'All saved entries', Icons.receipt_long_rounded, () => go(c, Transactions(s))),
                          const SizedBox(height: 12),
                          const Section('SYSTEM'),
                          Menu('Settings', 'Check Update + About + shop controls', Icons.settings_outlined, () => go(c, Settings(s))),
                        ],
                        const SizedBox(height: 24),
                        const Center(child: Text('By PaliaAPK HUB  •  Developer by shanpalia', style: TextStyle(color: Colors.black45, fontWeight: FontWeight.w700))),
                      ],
                    ),
                  );
                },
              );
            }
          }

          '''
          s = s[:start] + home + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign release APK for device installation
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/rentflow-test-release.jks"
          ALIAS="rentflow"
          PASSWORD="rentflow-release-2026"
          test -s "$APK"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASSWORD" -keypass "$PASSWORD" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RentFlow, OU=PaliaAPK HUB, O=ShanPalia, L=Lucknow, ST=Uttar Pradesh, C=IN" -noprompt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$PASSWORD" --key-pass "pass:$PASSWORD" --ks-key-alias "$ALIAS" --out "$APK" "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
