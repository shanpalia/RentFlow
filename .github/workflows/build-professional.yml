name: RentFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android platform if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --no-pub --project-name rentflow .
          fi
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Repair RentFlow Dart source before analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/main.dart')
          text = path.read_text()

          painter = r'''class _RentalPainter extends CustomPainter {
            @override
            void paint(Canvas canvas, Size size) {
              final metal = Paint()
                ..color = const Color(0xFF68777A)
                ..style = PaintingStyle.stroke
                ..strokeWidth = 3;
              final green = Paint()
                ..color = primaryDark
                ..style = PaintingStyle.stroke
                ..strokeWidth = 4;
              final roof = Path()
                ..moveTo(8, size.height * .45)
                ..lineTo(size.width * .5, 18)
                ..lineTo(size.width - 8, size.height * .45);
              canvas.drawPath(roof, green);
              canvas.drawLine(
                Offset(18, size.height * .44),
                Offset(18, size.height * .88),
                metal,
              );
              canvas.drawLine(
                Offset(size.width - 18, size.height * .44),
                Offset(size.width - 18, size.height * .88),
                metal,
              );
              for (var i = 0; i < 4; i++) {
                final x = 12 + i * 8.0;
                canvas.drawLine(
                  Offset(x, size.height * .62),
                  Offset(x, size.height * .88),
                  metal,
                );
              }
              canvas.drawLine(
                Offset(size.width * .58, size.height * .67),
                Offset(size.width * .93, size.height * .67),
                metal,
              );
              canvas.drawLine(
                Offset(size.width * .58, size.height * .74),
                Offset(size.width * .93, size.height * .74),
                metal,
              );
              canvas.drawLine(
                Offset(size.width * .58, size.height * .81),
                Offset(size.width * .93, size.height * .81),
                metal,
              );
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }

          '''
          text, count = re.subn(
              r'class _RentalPainter extends CustomPainter \{.*?\nclass StatCard',
              painter + 'class StatCard',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not locate _RentalPainter block')

          reports = r'''class ReportsPage extends StatelessWidget {
            final Store store;
            const ReportsPage({required this.store, super.key});

            @override
            Widget build(BuildContext context) {
              final revenue = store.rentals.fold<double>(
                0,
                (sum, e) => sum + amount(e['amount']),
              );
              return SafeArea(
                child: CustomScrollView(
                  slivers: [
                    const SliverToBoxAdapter(
                      child: _SimpleHeader(
                        title: 'Reports',
                        subtitle: 'Rental business overview',
                      ),
                    ),
                    SliverToBoxAdapter(
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 20),
                        child: Row(
                          children: [
                            Expanded(
                              child: _ReportCard(
                                title: 'Rentals',
                                value: '${store.rentals.length}',
                                icon: Icons.swap_horiz_rounded,
                              ),
                            ),
                            const SizedBox(width: 10),
                            Expanded(
                              child: _ReportCard(
                                title: 'Revenue',
                                value: rupees(revenue),
                                icon: Icons.payments_rounded,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    SliverToBoxAdapter(
                      child: Padding(
                        padding: const EdgeInsets.fromLTRB(20, 18, 20, 30),
                        child: Card(
                          child: Padding(
                            padding: const EdgeInsets.all(20),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text(
                                  'Rental History',
                                  style: TextStyle(
                                    fontSize: 20,
                                    fontWeight: FontWeight.w900,
                                    color: ink,
                                  ),
                                ),
                                const SizedBox(height: 14),
                                if (store.rentals.isEmpty)
                                  const Text(
                                    'No rental records yet.',
                                    style: TextStyle(color: muted),
                                  )
                                else
                                  ...store.rentals.reversed.map(
                                    (r) => Padding(
                                      padding: const EdgeInsets.symmetric(vertical: 8),
                                      child: Row(
                                        children: [
                                          Expanded(
                                            child: Text(
                                              '${r['customer']} • ${r['item']}',
                                              style: const TextStyle(
                                                fontWeight: FontWeight.w700,
                                              ),
                                            ),
                                          ),
                                          Text(
                                            rupees(r['amount']),
                                            style: const TextStyle(
                                              fontWeight: FontWeight.w900,
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                  ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          '''
          text, count = re.subn(
              r'class ReportsPage extends StatelessWidget \{.*?\nclass _ReportCard',
              reports + 'class _ReportCard',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not locate ReportsPage block')

          receive = r'''Future<void> receiveForm(
            BuildContext context,
            Store store,
            VoidCallback refresh,
          ) async {
            if (store.rentals.isEmpty) {
              if (!context.mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('No active rental found.')),
              );
              return;
            }
            final rental = store.rentals.last;
            rental['received'] = number(rental['qty']);
            await store.save();
            if (!context.mounted) return;
            refresh();
            ScaffoldMessenger.of(context).showSnackBar(
              const SnackBar(content: Text('Latest rental marked as returned.')),
            );
          }

          '''
          text, count = re.subn(
              r'Future<void> receiveForm\(BuildContext context, Store store, VoidCallback refresh\) async \{.*?\n\}\n\nFuture<void> invoiceDialog',
              receive + 'Future<void> invoiceDialog',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not locate receiveForm block')

          path.write_text(text)
          PY

      - name: Apply RentFlow launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/rentflow_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />
              <path android:fillColor="#007C69" android:pathData="M21,43 L54,18 L87,43 L81,50 L54,29 L27,50 Z" />
              <path android:fillColor="#007C69" android:pathData="M29,43 L36,43 L36,74 L29,74 Z M72,43 L79,43 L79,74 L72,74 Z" />
              <path android:fillColor="#00A889" android:pathData="M19,70 L59,70 L52,63 L58,57 L78,77 L58,97 L52,91 L59,84 L19,84 Z" />
              <path android:fillColor="#00A889" android:pathData="M89,54 L49,54 L56,61 L50,67 L30,47 L50,27 L56,33 L49,40 L89,40 Z" />
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/rentflow_launcher"', text, count=1)
          if 'android:roundIcon=' in text:
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/rentflow_launcher"', text, count=1)
          text = re.sub(r'android:label="[^"]+"', 'android:label="RentFlow"', text, count=1)
          manifest.write_text(text)
          PY
          grep -q '@drawable/rentflow_launcher' android/app/src/main/AndroidManifest.xml

      - name: Validate RentFlow source
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q 'class RentFlowApp' lib/main.dart
          grep -q 'class SettingsPage' lib/main.dart
          grep -q 'Check for Updates' lib/main.dart
          grep -q 'By PaliaAPK HUB' lib/main.dart
          grep -q 'Developer by ShanPalia' lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze lib
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
