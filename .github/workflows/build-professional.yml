name: RentFlow APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android platform
        shell: bash
        run: |
          set -e
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Android platform is missing; generating it from the Flutter project."
            flutter create --platforms=android --no-pub .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/gradlew

      - name: Apply RentFlow launcher icon
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/rentflow_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#00A889" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M24,42h44l-8,-8 7,-7 20,20 -20,20 -7,-7 8,-8H24z" />
              <path android:fillColor="#FFFFFFFF" android:pathData="M84,66H40l8,8 -7,7 -20,-20 20,-20 7,7 -8,8h44z" />
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/rentflow_launcher"', s, count=1)
          s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/rentflow_launcher"', s, count=1)
          s = re.sub(r'android:label="[^"]+"', 'android:label="RentFlow"', s, count=1)
          p.write_text(s)
          PY

      - name: Normalize RentFlow UI labels
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('Check for App Update', 'Check for Updates')
          s = s.replace('Check for App Updates', 'Check for Updates')
          p.write_text(s)
          PY
          grep -q "Check for Updates" lib/main.dart

      - name: Check Flutter project
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q "class RentFlowApp" lib/main.dart
          grep -q "SettingsPage" lib/main.dart
          grep -q "Check for Updates" lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze RentFlow
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
