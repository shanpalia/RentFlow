name: RentFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Android platform if missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --no-pub --project-name rentflow .
          fi
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Apply RentFlow launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/rentflow_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFFFF" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />
              <path android:fillColor="#007C69" android:pathData="M21,43 L54,18 L87,43 L81,50 L54,29 L27,50 Z" />
              <path android:fillColor="#007C69" android:pathData="M29,43 L36,43 L36,74 L29,74 Z M72,43 L79,43 L79,74 L72,74 Z" />
              <path android:fillColor="#00A889" android:pathData="M19,70 L59,70 L52,63 L58,57 L78,77 L58,97 L52,91 L59,84 L19,84 Z" />
              <path android:fillColor="#00A889" android:pathData="M89,54 L49,54 L56,61 L50,67 L30,47 L50,27 L56,33 L49,40 L89,40 Z" />
          </vector>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/rentflow_launcher"', text, count=1)
          if 'android:roundIcon=' in text:
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/rentflow_launcher"', text, count=1)
          text = re.sub(r'android:label="[^"]+"', 'android:label="RentFlow"', text, count=1)
          manifest.write_text(text)
          PY
          grep -q '@drawable/rentflow_launcher' android/app/src/main/AndroidManifest.xml

      - name: Validate RentFlow source
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q 'class RentFlowApp' lib/main.dart
          grep -q 'class SettingsPage' lib/main.dart
          grep -q 'Check for App Update' lib/main.dart
          grep -q 'By PaliaAPK HUB' lib/main.dart
          grep -q 'Developer by ShanPalia' lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze lib
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
