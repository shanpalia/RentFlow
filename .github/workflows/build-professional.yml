name: RentFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android local.properties
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android wrapper --gradle-version 8.11.1
          chmod +x android/gradlew

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/app.dart
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
