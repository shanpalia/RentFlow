name: RentFlow Professional APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android project
        run: flutter create --project-name rentflow --org com.shanpalia --platforms android .

      - name: Use approved professional UI
        run: cp tool/professional_main.dart lib/main.dart

      - name: Set release version
        run: sed -i "s/version: 1.0.0+2/version: 1.0.1+3/" pubspec.yaml

      - name: Apply RentFlow icon and native splash
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values-v31 android/app/src/main/res/values-night-v31
          cat > android/app/src/main/res/drawable/ic_rentflow.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00A889" android:pathData="M18,4 L90,4 Q104,4 104,18 L104,90 Q104,104 90,104 L18,104 Q4,104 4,90 L4,18 Q4,4 18,4 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M25,42 L65,42 L57,34 L63,28 L82,47 L63,66 L57,60 L65,52 L25,52 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M83,66 L43,66 L51,58 L45,52 L26,71 L45,90 L51,84 L43,76 L83,76 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@android:color/white"/><item android:gravity="center" android:drawable="@drawable/ic_rentflow"/></layer-list>
          EOF
          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:forceDarkAllowed">false</item><item name="android:windowSplashScreenBackground">#FFFFFF</item><item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_rentflow</item></style><style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:windowBackground">#F5F9F7</item></style></resources>
          EOF
          cp android/app/src/main/res/values-v31/styles.xml android/app/src/main/res/values-night-v31/styles.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:label="rentflow"','android:label="RentFlow"').replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_rentflow"').replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/ic_rentflow"')
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload professional APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-Professional-release
          path: build/app/outputs/flutter-apk/app-release.apk
