name: RentFlow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --project-name rentflow --org com.shanpalia --platforms android .

      - name: Configure RentFlow navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()

          if "SettingsPage(onCheck: checkForUpdate)" not in s:
              marker = "      ReportsPage(store: store),\n    ];"
              if marker not in s:
                  raise SystemExit('Reports page block not found')
              s = s.replace(marker, "      ReportsPage(store: store),\n      SettingsPage(onCheck: checkForUpdate),\n    ];", 1)

          old_nav = "NavigationDestination(icon: Icon(Icons.bar_chart_outlined), selectedIcon: Icon(Icons.bar_chart_rounded), label: 'Reports')"
          new_nav = "NavigationDestination(icon: Icon(Icons.bar_chart_outlined), selectedIcon: Icon(Icons.bar_chart_rounded), label: 'Reports'), NavigationDestination(icon: Icon(Icons.settings_outlined), selectedIcon: Icon(Icons.settings_rounded), label: 'Settings')"
          if "label: 'Settings'" not in s:
              if old_nav not in s:
                  raise SystemExit('Reports navigation destination not found')
              s = s.replace(old_nav, new_nav, 1)

          s = s.replace(", IconButton(onPressed: onSettings, icon: const Icon(Icons.settings_rounded))", "", 1)
          p.write_text(s)

      - name: Remove generated Flutter tests
        run: rm -rf test

      - name: Apply RentFlow branding, launcher icon and native splash
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values-v31 android/app/src/main/res/values-night-v31
          cat > android/app/src/main/res/drawable/ic_rentflow.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00A889" android:pathData="M18,4 L90,4 Q104,4 104,18 L104,90 Q104,104 90,104 L18,104 Q4,104 4,90 L4,18 Q4,4 18,4 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M24,67 L24,43 L54,25 L84,43 L84,67 L77,67 L77,47 L54,34 L31,47 L31,67 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M26,48 L53,31 L82,48 L77,55 L53,41 L31,55 Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M25,70 L64,70 L56,62 L62,56 L84,78 L62,100 L56,94 L64,86 L25,86 Z"/>
          </vector>
          EOF

          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@android:color/white"/><item android:gravity="center" android:drawable="@drawable/ic_rentflow"/></layer-list>
          EOF

          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><resources><style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:forceDarkAllowed">false</item><item name="android:windowSplashScreenBackground">#FFFFFF</item><item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_rentflow</item></style><style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar"><item name="android:windowBackground">#F5F9F7</item></style></resources>
          EOF
          cp android/app/src/main/res/values-v31/styles.xml android/app/src/main/res/values-night-v31/styles.xml

          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:label="rentflow"','android:label="RentFlow"')
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_rentflow"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/ic_rentflow"')
          if 'android:enableOnBackInvokedCallback' not in s:
              s=s.replace('<application','<application android:enableOnBackInvokedCallback="true"',1)
          p.write_text(s)
          PY

      - name: Set release version
        run: sed -i "s/version: 1.0.0+2/version: 1.0.1+3/" pubspec.yaml

      - name: Clean and get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Verify RentFlow source
        run: |
          test -f lib/main.dart
          grep -q "class RentFlowApp" lib/main.dart
          grep -q "label: 'Settings'" lib/main.dart

      - name: Analyze RentFlow source
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload RentFlow APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release-v1.0.1
          path: build/app/outputs/flutter-apk/app-release.apk
