name: RentFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android wrapper --gradle-version 8.11.1
          chmod +x android/gradlew

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/app.dart
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/settings.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
