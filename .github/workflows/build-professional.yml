name: RentFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RentFlow APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Create Android local.properties
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android wrapper --gradle-version 8.14.3
          chmod +x android/gradlew

      - name: Restore RentFlow source after repair commit
        if: github.event.before == '49fc3db34c6d84a841d73b2929191cff21b41270'
        shell: bash
        run: |
          set -euo pipefail
          git checkout efa9e558965a98f8ca18bcd3465b8dd4ca490b0e -- lib/rentflow_emerald.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/rentflow_emerald.dart')
          s = p.read_text()
          old = "      );\n\nclass HomePage extends StatefulWidget {"
          new = "      );\n}\n\nclass HomePage extends StatefulWidget {"
          if old not in s:
              raise SystemExit('Expected AppDrawer/HomePage boundary not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/repair-rentflow.yml

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f android/gradlew
          test -f assets/rentflow_logo.svg
          test -f assets/rentflow_splash.svg
          test -f lib/rentflow_emerald.dart
          test -f lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib
          if ! git diff --quiet -- lib .github/workflows/repair-rentflow.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib .github/workflows/repair-rentflow.yml
            git commit -m "fix: restore RentFlow source"
            git push
          fi

      - name: Verify formatted Dart source
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign release APK for device installation
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/rentflow-test-release.jks"
          ALIAS="rentflow"
          PASSWORD="rentflow-release-2026"
          test -s "$APK"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASSWORD" -keypass "$PASSWORD" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RentFlow, OU=PaliaAPK HUB, O=ShanPalia, L=Lucknow, ST=Uttar Pradesh, C=IN" -noprompt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$PASSWORD" --key-pass "pass:$PASSWORD" --ks-key-alias "$ALIAS" --out "$APK" "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RentFlow-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
