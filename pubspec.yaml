name: rentflow
description: RentFlow - Rental Management App by PaliaAPK HUB
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  http: ^1.5.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
